name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    name: ${{ matrix.os }} web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock: linux
          - os: macos-latest
            lock: macos
          - os: windows-latest
            lock: windows
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Read the pinned Comic Sol engine commit
      id: engine
      shell: bash
      run: |
        sha="$(grep -E '^[0-9a-f]{40}$' ENGINE_COMMIT)"
        test -n "$sha"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Check out the pinned Comic Sol engine
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: wenn-id/comicsol
        ref: ${{ steps.engine.outputs.sha }}
        path: .engine
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install Web and engine base dependencies from hash locks
      shell: bash
      run: |
        python -m pip install --require-hashes -r requirements/locks/web-${{ matrix.lock }}-x86_64.txt
        python -m pip install --require-hashes -r .engine/requirements/locks/base-${{ matrix.lock }}-x86_64.txt
    - name: Build and install the pinned engine wheel
      shell: bash
      run: |
        cd .engine
        python -m build --no-isolation --wheel -o dist
        python -m pip install --no-deps --force-reinstall dist/comic_sol-*.whl
    - name: Build and install the Studio distribution without resolving uncontrolled dependencies
      shell: bash
      run: |
        python -m build --no-isolation --wheel -o dist
        python -m pip install --no-deps --force-reinstall dist/comic_sol_web-*.whl
    - name: Remove the engine checkout so tests use the installed wheel
      shell: bash
      run: rm -rf .engine
    - name: Verify isolated Web test discovery
      shell: bash
      run: python -m unittest discover -s tests -p "test_app.py" -v
    - name: Run the Web test suite
      shell: bash
      env:
        COMIC_SOL_REQUIRE_SYMLINK_TESTS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      run: python -m unittest discover -s tests -p "test_*.py" -v
    - name: Run the focused project gateway contract
      shell: bash
      env:
        COMIC_SOL_REQUIRE_SYMLINK_TESTS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      run: python -m unittest tests.test_projects -v
    - name: Get healthz via the test client
      shell: bash
      env:
        # Quoted so YAML does not parse the all-digit strings as octal/numbers.
        COMIC_SOL_WEB_SESSION_SECRET: "comic-sol-web-session-secret-0000000000000000"
        COMIC_SOL_WEB_ENCRYPTION_SECRET: "comic-sol-web-encryption-secret-00000000"
        COMIC_SOL_WEB_DATA_ROOT: ${{ runner.temp }}/comic-sol-web-data
      run: |
        python - <<'PYEOF'
        import os
        from fastapi.testclient import TestClient
        from comic_sol_web.config import WebConfig
        from comic_sol_web.app import create_app

        config = WebConfig.from_env(os.environ)
        client = TestClient(create_app(config))
        response = client.get("/healthz")
        assert response.status_code == 200, response.status_code
        assert response.json() == {"status": "ok"}, response.json()
        print("healthz ok")
        PYEOF

  web-quality:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
    - name: Install Web dependencies from hash lock
      run: python -m pip install --require-hashes -r requirements/locks/web-linux-x86_64.txt
    - name: Ruff check
      run: python -m ruff check comic_sol_web tests tools
    - name: Ruff format check
      run: python -m ruff format --check comic_sol_web tests tools
    - name: Mypy
      run: python -m mypy comic_sol_web tests
